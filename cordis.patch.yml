# dsh-auto-title bundle patch
#
# 安装（标准 bundle 插件，不改 dsh 源码）：
#   dsh plugin --profile web add /data/dsh-workspace/dsh-auto-title
# 卸载：
#   dsh plugin --profile web remove dsh-auto-title
# 安装/卸载后重启 dsh 生效（本插件支持安装后热重载，但为保持与 dsh-web-fetch 一致，仍建议重启；按用户约束，本次只执行安装，不执行重启）。
#
# 本插件实现 Hermes 对标的会话自动标题逻辑：
#   - 前端：新会话用户首条消息立刻截取首句做临时标题展示（乐观更新）
#   - 后端：首轮完整问答结束后异步非阻塞调用 LLM 生成正式简短标题，覆盖临时标题
#   - 约束：每会话只自动生成一次；用户手动改标题后不再覆盖；推理模型自动过滤 think 标签；失败保留临时标题
#
# 配置覆盖示例（~/.dsh/profiles/web/cordis.patch.yml 追加，整段替换 config）：
# - id: auto-title
#   config:
#     enabled: true
#     provider: ''
#     model: ''
#     timeoutMs: 15000
#     targetWords: 5
#     targetCjkCharacters: 10
#     maxInputBytes: 4096
#     maxOutputTokens: 64
#     fallbackMaxWords: 8
#     fallbackMaxBytes: 60
#     maxTitleBytes: 80

- insert:
    - id: auto-title
      name: 'dsh-auto-title'
      config:
        enabled: true
        provider: ''
        model: ''
        baseURL: ''
        apiKey: ''
        timeoutMs: 15000
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 64
        fallbackMaxWords: 8
        fallbackMaxBytes: 60
        maxTitleBytes: 80
